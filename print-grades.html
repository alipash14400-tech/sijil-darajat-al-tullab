<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>طباعة سجل الدرجات</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f1;color:#172027;font-family:Arial,Tahoma,sans-serif}.toolbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:12px;background:#12304a;color:#fff}.toolbar button{border:0;border-radius:8px;background:#0f766e;color:#fff;font:700 16px Arial,Tahoma,sans-serif;padding:12px 20px;min-height:48px}.toolbar span{font-size:14px;text-align:center}main{padding:18px}.pdf-page{width:100%;max-width:190mm;margin:0 auto 18px;padding:8mm;background:#fff;color:#111;direction:rtl;box-shadow:0 2px 14px #0002;break-after:page;page-break-after:always}.pdf-page:last-child{break-after:auto;page-break-after:auto}.pdf-main-title{text-align:center;font-size:20px;font-weight:700;margin:0 0 3px}.pdf-section-title{text-align:center;font-size:16px;font-weight:700;margin:0 0 10px}.pdf-meta{display:grid;width:100%;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:0 auto 10px}.pdf-meta-cell{border:1px solid #89938f;padding:4px 6px;min-height:36px}.pdf-meta-label{font-size:9px;color:#404b49}.pdf-meta-value{font-size:11px;font-weight:700;min-height:18px}.pdf-table{width:100%;table-layout:fixed;border-collapse:collapse;direction:rtl;font:10px Arial,Tahoma,sans-serif;color:#111}.pdf-table th,.pdf-table td{border:1px solid #777;text-align:center;padding:3px 2px;white-space:normal;overflow-wrap:anywhere}.pdf-table thead th{background:#e7eeeb;font-size:9px}.pdf-table thead tr.grp th{background:#d5e0dc;font-size:10px}.pdf-table td.num{width:32px;background:#edf1ef}.pdf-cell{display:block;min-height:16px;line-height:1.3;overflow-wrap:anywhere}.pdf-table td.calc{background:#f1f4f2;font-weight:700}
@page{size:A4 portrait;margin:10mm}@media print{body{background:#fff}.toolbar{display:none!important}main{padding:0}.pdf-page{max-width:none;width:100%;margin:0;padding:0;box-shadow:none}.pdf-page:last-child{break-after:auto;page-break-after:auto}.pdf-meta{break-inside:avoid;page-break-inside:avoid}.pdf-table thead{display:table-header-group}.pdf-table tr{break-inside:avoid;page-break-inside:avoid}}
</style>
</head>
<body>
<div class="toolbar"><button id="print-now" type="button">طباعة أو حفظ PDF</button><span>اختر «طباعة» أو «حفظ PDF» من خيارات Safari.</span></div>
<main id="pages" aria-live="polite"></main>
<script>
(function(){
 var allowedTags={SECTION:1,DIV:1,TABLE:1,THEAD:1,TBODY:1,TR:1,TH:1,TD:1,SPAN:1};
 var allowedClasses={"pdf-page":1,"pdf-main-title":1,"pdf-section-title":1,"pdf-meta":1,"pdf-meta-cell":1,"pdf-meta-label":1,"pdf-meta-value":1,"pdf-table":1,grp:1,num:1,calc:1,"pdf-cell":1};
 function copySafe(source,parent){
  Array.prototype.forEach.call(source.childNodes,function(node){
   if(node.nodeType===3){parent.appendChild(document.createTextNode(node.nodeValue));return}
   if(node.nodeType!==1||!allowedTags[node.tagName])return;
   var copy=document.createElement(node.tagName.toLowerCase());
   (node.className||"").split(/\s+/).forEach(function(name){if(allowedClasses[name])copy.classList.add(name)});
   ["colspan","rowspan"].forEach(function(name){var value=Number(node.getAttribute(name));if(Number.isInteger(value)&&value>0&&value<100)copy.setAttribute(name,String(value))});
   parent.appendChild(copy);copySafe(node,copy);
  });
 }
 try{
  var pages=JSON.parse(decodeURIComponent(location.hash.slice(1)));
  if(!Array.isArray(pages)||!pages.length||pages.length>10)throw new Error("invalid pages");
  pages.forEach(function(markup){if(typeof markup!=="string")throw new Error("invalid page");var parsed=new DOMParser().parseFromString(markup,"text/html");copySafe(parsed.body,document.getElementById("pages"))});
 }catch(_){document.getElementById("pages").textContent="تعذر فتح سجل الطباعة. ارجع إلى التطبيق واضغط زر الطباعة مرة أخرى."}
 document.getElementById("print-now").addEventListener("click",function(){window.print()});
})();
</script>
</body>
</html>
