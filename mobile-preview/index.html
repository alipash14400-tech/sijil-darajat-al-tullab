function averagePair(a,b){let x=asNumber(a),y=asNumber(b);return x===null||y===null?'—':((x+y)/2).toFixed(1)}
function gradeInput(student,key,value,max=100,disabled=false){return `<input class="grade-input" type="number" min="0" max="${max}" step="0.1" data-grade-field="${key}" data-student-id="${student.id}" value="${esc(value??'')}" ${disabled?'disabled':''} aria-label="${key}">`}

function renderGrades(){let early=isEarlyPrimary(),rows=data.students.map(st=>{let g=st.grades||{};if(early)return `<tr><td><strong>${esc(st.name)}</strong></td><td>${esc(st.className||data.profile.grade||'—')}</td><td><select class="grade-input" data-grade-field="mode" data-student-id="${st.id}"><option ${(!g.mode||g.mode==='وصفية')?'selected':''}>وصفية</option><option ${g.mode==='من 10'?'selected':''}>من 10</option></select></td><td>${gradeInput(st,'score10',g.score10,10,(g.mode||'وصفية')!=='من 10')}</td><td><input class="grade-input" style="width:170px" type="text" data-grade-field="description" data-student-id="${st.id}" value="${esc(g.description||'')}" placeholder="متميز، جيد..."></td></tr>`;let a1=averagePair(g.c1m1,g.c1m2),a2=averagePair(g.c2m1,g.c2m2),mid=asNumber(g.mid),eff=a1==='—'||a2==='—'||mid===null?'—':((Number(a1)+mid+Number(a2))/3).toFixed(1);return `<tr><td><strong>${esc(st.name)}</strong></td><td>${esc(st.className||data.profile.grade||'—')}</td><td>${gradeInput(st,'c1m1',g.c1m1)}</td><td>${gradeInput(st,'c1m2',g.c1m2)}</td><td class="grade-result">${a1}</td><td>${gradeInput(st,'mid',g.mid)}</td><td>${gradeInput(st,'c2m1',g.c2m1)}</td><td>${gradeInput(st,'c2m2',g.c2m2)}</td><td class="grade-result">${a2}</td><td class="grade-result">${eff}</td></tr>`});let headers=early?['اسم الطالب','الصف','طريقة التقييم','الدرجة / 10','التقييم الوصفي']:['اسم الطالب','الصف','شهر 1 - فصل 1','شهر 2 - فصل 1','معدل الفصل الأول','نصف السنة / 100','شهر 1 - فصل 2','شهر 2 - فصل 2','معدل الفصل الثاني','السعي السنوي'],description=early?'للصفوف 1 إلى 4 الابتدائية: تقييم وصفي أو درجة من 10.':'درجات شهرية ونصف السنة مع احتساب المعدلات والسعي السنوي تلقائيًا.';return `${head('التقويم والتحصيل','سجل الدرجات',description,'<button class="btn secondary small" onclick="window.print()">طباعة / حفظ PDF</button>')}<div class="card"><div class="card-head"><h3>${esc(data.profile.stage||'المرحلة')} · ${esc(data.profile.grade||'الصف')}</h3><button class="link" data-go="students">إدارة أسماء الطلبة ←</button></div>${table(headers,rows,'أضف أسماء الطلبة أولًا من صفحة متابعة الطلبة.')}${early?'<div class="formula-note">للصفوف 1-4 الابتدائية: اختر التقييم الوصفي أو أدخل درجة من 10 بحسب طريقة التقويم المستخدمة.</div>':'<div class="formula-note"><strong>معادلات السجل:</strong><br>معدل الفصل الأول = (درجة الشهر الأول + درجة الشهر الثاني) ÷ 2.<br>معدل الفصل الثاني = (درجة الشهر الأول + درجة الشهر الثاني) ÷ 2.<br>السعي السنوي = (معدل الفصل الأول + درجة نصف السنة + معدل الفصل الثاني) ÷ 3.</div>'}</div>`}
function renderSettings(){let p=data.profile;return `${head('تخصيص البرنامج','الإعدادات وبيانات المدرسة','تُستخدم بياناتك لتخصيص لوحة المدرس والتحضيرات.')}<div class="settings-grid"><section class="card setting-card"><h3>بيانات المدرس والمدرسة</h3><form id="profile-form"><div class="form-grid">${[['teacher','اسم المدرس/ة','text'],['school','اسم المدرسة','text'],['principal','اسم مدير المدرسة','text'],['directorate','المديرية العامة للتربية في محافظة','text'],['subject','المادة الدراسية','text'],['specialty','الاختصاص','text'],['stage','المرحلة الدراسية','text'],['grade','الصف الدراسي','text'],['className','الشعبة / الصف المختصر','text'],['gender','صفة المدرس','text'],['year','العام الدراسي','text']].map(([k,l,t])=>`<div class="form-field"><label>${l}</label><input name="${k}" type="${t}" value="${esc(p[k])}" placeholder="${k==='year'?'مثال: 2026 - 2027':''}"></div>`).join('')}</div><div style="margin-top:12px"><button class="btn primary" type="submit">حفظ البيانات</button></div></form></section><section class="card setting-card"><h3>المظهر والألوان</h3><div class="form-field"><label>اللون الأساسي</label><div class="color-swatches">${[['blue','#2864d7'],['green','#16836f'],['purple','#7952c8'],['rose','#d34f78'],['amber','#b87912']].map(([k,c])=>`<button type="button" class="color-swatch ${data.appearance.accent===k?'active':''}" style="background:${c}" data-accent-choice="${k}" aria-label="${colorNames[k]}" title="${colorNames[k]}"></button>`).join('')}</div></div><div class="form-field"><label>نمط العرض</label><div class="mode-switch"><button type="button" class="mode-choice ${data.appearance.mode==='light'?'active':''}" data-mode-choice="light">☀ فاتح</button><button type="button" class="mode-choice ${data.appearance.mode==='dark'?'active':''}" data-mode-choice="dark">☾ داكن</button></div></div><p class="muted" style="font-size:11px;margin-top:14px">يُحفظ اختيار اللون والمظهر تلقائيًا على هذا الجهاز.</p></section><section class="card setting-card"><h3>النسخ الاحتياطي والخصوصية</h3><div class="rights-panel"><img src="./assets/developer-rights.jpg" alt="ملكية وحقوق برنامج دفتر الخطة الدراسية"><p>برنامج دفتر الخطة الدراسية من تطوير وبرمجة علي بهار العبودي. جميع الحقوق محفوظة.</p><a href="https://wa.me/9647815614400" target="_blank" rel="noopener noreferrer">التواصل عبر واتساب: 07815614400</a></div><p class="muted" style="font-size:12px;line-height:1.9">بياناتك محفوظة محليًا في المتصفح على هذا الجهاز. نزّل نسخة احتياطية للاحتفاظ بها أو لنقلها إلى جهاز آخر.</p><div style="display:grid;gap:9px"><button class="btn secondary" id="show-welcome">☼ عرض شاشة الترحيب</button><button class="btn secondary" id="export">⇩ تنزيل نسخة احتياطية</button><label class="btn secondary" for="import-file">⇧ استعادة نسخة احتياطية</label><input id="import-file" type="file" accept="application/json,.json" hidden><button class="btn danger" id="clear">مسح بيانات البرنامج</button></div><div style="border-top:1px solid var(--line);margin-top:20px;padding-top:14px"><div class="eyebrow">دفتر الخطة الدراسية · النسخة العراقية</div><div class="muted" style="font-size:11px">قالب مخصص لتنظيم الخطة وفق الأقسام العراقية التي حددتها.</div></div></section></div>`}
function render(){let html={home:renderHome,lessons:renderLessons,lessonView:renderLessonView,custom:renderCustom,annual:renderAnnual,monthly:renderMonthly,schedule:renderSchedule,students:renderStudents,grades:renderGrades,settings:renderSettings}[pageName]();$('#view').innerHTML=html;wirePage()}
function wirePage(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));let s=$('#search');if(s)s.oninput=()=>{search=s.value;let pos=s.selectionStart;render();let ns=$('#search');ns.focus();ns.setSelectionRange(pos,pos)};let pf=$('#profile-form');if(pf)pf.onsubmit=e=>{e.preventDefault();Object.assign(data.profile,Object.fromEntries(new FormData(pf)));save();toast('تم حفظ بيانات المدرسة');render()};let ex=$('#export');if(ex)ex.onclick=exportData;let im=$('#import-file');if(im)im.onchange=importData;let cl=$('#clear');if(cl)cl.onclick=()=>{if(confirm('سيتم حذف جميع بيانات البرنامج من هذا الجهاز. هل تريد المتابعة؟')){data=empty();save();applyAppearance();toast('تم مسح البيانات');render()}};let welcome=$('#show-welcome');if(welcome)welcome.onclick=()=>showWelcome(true);document.querySelectorAll('[data-accent-choice]').forEach(b=>b.onclick=()=>chooseAppearance('accent',b.dataset.accentChoice));document.querySelectorAll('[data-mode-choice]').forEach(b=>b.onclick=()=>chooseAppearance('mode',b.dataset.modeChoice))}
const iraqiMonths=['تشرين الأول','تشرين الثاني','كانون الأول','كانون الثاني','شباط','آذار','نيسان','أيار'];
const weekdayOptions=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
const schemas={
 lessons:{title:'تحضير الدرس اليومي',fields:[['day','اليوم','select',weekdayOptions],['date','التاريخ','date'],['period','الحصة','number'],['subject','المادة','text'],['title','الموضوع','text'],['className','الصف والشعبة','text'],['unit','الوحدة / الصفحة','text'],['objectiveKnowledge','الأهداف السلوكية المعرفية','textarea'],['objectiveSkill','الأهداف السلوكية المهارية','textarea'],['objectiveAttitude','الأهداف السلوكية الوجدانية','textarea'],['tools','الوسائل التعليمية والتقنيات','textarea'],['warmup','التمهيد (5 دقائق)','textarea'],['presentation','العرض (25 دقيقة)','textarea'],['assessment','التقويم (10 دقائق)','textarea'],['homework','الواجب البيتي (5 دقائق)','textarea'],['feedback','الملاحظات والتغذية الراجعة','textarea']]},

 monthly:{title:'خطة شهرية',fields:[['month','الشهر','select',iraqiMonths],['term','الفصل الدراسي','select',['الكورس الأول','الكورس الثاني']],['className','الصف والشعبة','text'],['topics','الموضوعات والأهداف','textarea'],['activities','الأنشطة والوسائل','textarea'],['progress','حالة الخطة','select',['قيد التنفيذ','مكتمل','يحتاج متابعة']],['notes','مراجعة نهاية الشهر','textarea']]},
 schedule:{title:'حصة في الجدول الأسبوعي',fields:[['day','اليوم','select',weekdayOptions],['period','رقم الحصة','number'],['subject','المادة','text'],['className','الصف والشعبة','text'],['room','الصف / القاعة','text']]},
 students:{title:'طالب في سجل المتابعة',fields:[['name','اسم الطالب','text'],['className','الصف والشعبة','text'],['participation','المشاركة والواجب','text'],['level','مستوى التحصيل','select',['جيد جدًا','جيد','متوسط','يحتاج دعم']],['note','ملاحظات المدرس / إجراء الدعم','textarea']]}};
function openForm(kind,id){let sch=schemas[kind],arr=data[kind],item=id?arr.find(x=>x.id===id):{},title=item?`تعديل ${sch.title}`:`إضافة ${sch.title}`;let fields=sch.fields.map(([key,label,type,opts])=>{let val=item?.[key]??(key==='subject'?data.profile.subject:key==='className'?(data.profile.className||data.profile.grade):key==='term'?(item?.term||'الكورس الأول'):key==='month'?(item?.month||iraqiMonths[0]):'');let c=type==='textarea'?`<textarea name="${key}" placeholder="اكتب هنا...">${esc(val)}</textarea>`:type==='select'?`<select name="${key}"><option value="">اختر...</option>${opts.map(o=>`<option ${val===o?'selected':''}>${o}</option>`).join('')}</select>`:`<input name="${key}" type="${type}" value="${esc(val)}" ${key==='periods'?'min="1"':''}>`;return `<div class="form-field ${type==='textarea'?'full':''}"><label>${label}</label>${c}</div>`}).join('');$('#modal-root').innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="modal"><div class="modal-head"><h3>${title}</h3><button class="close" type="button" data-close>×</button></div><form id="edit-form"><div class="form-grid">${fields}</div><div class="modal-foot"><button class="btn primary" type="submit">حفظ</button><button class="btn secondary" type="button" data-close>إلغاء</button></div></form></section></div>`;$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()};document.querySelectorAll('[data-close]').forEach(x=>x.onclick=closeModal);let monthSelect=$('#edit-form [name=month]'),termSelect=$('#edit-form [name=term]');if(monthSelect&&termSelect)monthSelect.onchange=()=>{termSelect.value=iraqiMonths.indexOf(monthSelect.value)<4?'الكورس الأول':'الكورس الثاني'};$('#edit-form').onsubmit=e=>{e.preventDefault();let val=Object.fromEntries(new FormData(e.currentTarget));if(kind==='lessons'&&!val.title.trim()){toast('اكتب عنوان الدرس أولًا');return}if(kind==='annual'&&!val.title.trim()){toast('اكتب الموضوع أولًا');return}if(kind==='students'&&!val.name.trim()){toast('اكتب اسم الطالب أولًا');return}if(item)Object.assign(item,val);else arr.unshift({id:crypto.randomUUID(),...val});save();closeModal();render();toast('تم الحفظ بنجاح')}}
function closeModal(){$('#modal-root').innerHTML=''}

document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let {action,kind,id}=b.dataset;if(action==='view-lesson'){selectedLessonId=id;pageName='lessonView';$('#crumb').textContent='الرئيسية / '+names.lessonView;render();return}if(action==='new'){if(kind==='custom')openCustomForm();else openForm(kind)}if(action==='edit'){if(kind==='custom')openCustomForm(id);else openForm(kind,id)}if(action==='delete'){let arr=data[kind],item=arr.find(x=>x.id===id);if(confirm(`حذف ${item?.title||item?.name||'هذا السجل'}؟`)){data[kind]=arr.filter(x=>x.id!==id);if(kind==='custom'&&selectedRecordId===id)selectedRecordId=null;save();render();toast('تم حذف السجل')}}if(action==='open'){selectedRecordId=id;render()}if(action==='back-records'){selectedRecordId=null;render()}if(action==='add-column'){let x=recordById();if(x){x.columns.push('عمود جديد');x.rows.forEach(r=>r.cells.push(''));save();render()}}if(action==='add-row'||action==='add-subrow'){let x=recordById();if(x){let rid=()=>crypto.randomUUID(),parent=action==='add-subrow'?id:null,at=parent?x.rows.findIndex(r=>r.id===parent)+1:x.rows.length;x.rows.splice(at,0,{id:rid(),parentId:parent,cells:x.columns.map(()=> '')});save();render()}}if(action==='delete-row'){let x=recordById();if(x){let remove=new Set([id]);let changed=true;while(changed){changed=false;x.rows.forEach(r=>{if(r.parentId&&remove.has(r.parentId)&&!remove.has(r.id)){remove.add(r.id);changed=true}})}x.rows=x.rows.filter(r=>!remove.has(r.id));save();render()}}if(action==='delete-column'){let x=recordById(),i=Number(b.dataset.index);if(x&&x.columns.length>1){x.columns.splice(i,1);x.rows.forEach(r=>r.cells.splice(i,1));save();render()}else toast('يجب أن يحتوي السجل على عمود واحد على الأقل')}if(action==='print-record')printRecord()});
document.addEventListener('input',e=>{let t=e.target;if((t.tagName==='INPUT'&&['text','search','tel','url','email'].includes(t.type))||t.tagName==='TEXTAREA'){let v=latinDigits(t.value);if(v!==t.value){let pos=t.selectionStart;t.value=v;try{t.setSelectionRange(pos,pos)}catch{}}}});
document.addEventListener('change',e=>{let t=e.target;if(t.matches('[data-cell]')){let x=data.customRecords.find(r=>r.id===t.dataset.cell),row=x?.rows.find(r=>r.id===t.dataset.row);if(row){row.cells[Number(t.dataset.col)]=t.value;save()}}if(t.matches('[data-column]')){let x=data.customRecords.find(r=>r.id===t.dataset.column);if(x){x.columns[Number(t.dataset.col)]=t.value||'عمود';save()}}if(t.matches('[data-grade-field]')){let st=data.students.find(x=>x.id===t.dataset.studentId);if(st){let field=t.dataset.gradeField;st.grades=st.grades||{};if(t.type==='number'&&t.value!==''&&(Number(t.value)<0||Number(t.value)>Number(t.max))){toast(`الدرجة يجب أن تكون بين 0 و${t.max}`);t.value='';return}st.grades[field]=t.value;save();render()}}if(t.id==='record-orientation'){let x=recordById();if(x){x.orientation=t.value;save();let section=document.querySelector('.record-detail');if(section)section.dataset.orientation=t.value}}});
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`نسخة-الخطة-الدراسية-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);toast('تم تنزيل النسخة الاحتياطية')}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.profile||!Array.isArray(x.lessons))throw Error();data=normalizeDigits({...empty(),...x});data.customRecords=Array.isArray(data.customRecords)?data.customRecords:[];data.lessons.forEach(x=>{if(!x.presentation&&x.steps)x.presentation=x.steps});data.schedule=Array.isArray(data.schedule)?data.schedule:[];data.appearance={mode:'light',accent:'blue',...(data.appearance||{})};save();applyAppearance();render();toast('تم استعادة البيانات بنجاح')}catch{toast('الملف غير صالح أو ليس نسخة من دفتر الخطة الدراسية')}e.target.value=''};r.readAsText(f)}
